<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - HackConnect Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        
        nav {
            background-color: #34495e;
            padding: 0.5rem;
            display: flex;
            justify-content: center;
        }
        
        nav a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            margin: 0 0.5rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }
        
        nav a:hover {
            background-color: #2c3e50;
        }
        
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .sidebar {
            width: 300px;
            background-color: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .conversation-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .conversation {
            padding: 1rem;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
        }
        
        .conversation:hover {
            background-color: #f0f0f0;
        }
        
        .conversation.active {
            background-color: #e6f7ff;
            border-left: 3px solid #1890ff;
        }
        
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 1rem;
            font-weight: bold;
        }
        
        .conversation-info {
            flex: 1;
        }
        
        .conversation-name {
            font-weight: bold;
            margin-bottom: 0.25rem;
        }
        
        .last-message {
            font-size: 0.85rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #f9f9f9;
        }
        
        .chat-header {
            padding: 1rem;
            background-color: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-header-info {
            display: flex;
            align-items: center;
        }
        
        .chat-header-actions {
            display: flex;
            gap: 0.5rem;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .btn-icon:hover {
            background-color: #f0f0f0;
        }
        
        .btn-call {
            color: #27ae60;
        }
        
        .btn-video {
            color: #2980b9;
        }
        
        .messages {
            flex: 1;
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            max-width: 70%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }
        
        .message.sent {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-bottom-right-radius: 0;
        }
        
        .message.received {
            align-self: flex-start;
            background-color: white;
            border-bottom-left-radius: 0;
        }
        
        .message-time {
            font-size: 0.7rem;
            color: #999;
            text-align: right;
            margin-top: 0.25rem;
        }
        
        .message-input {
            padding: 1rem;
            background-color: white;
            border-top: 1px solid #ddd;
            display: flex;
            align-items: center;
        }
        
        .message-input input {
            flex: 1;
            padding: 0.75rem 1rem;
            border: 1px solid #ddd;
            border-radius: 1.5rem;
            outline: none;
            font-size: 1rem;
        }
        
        .message-input button {
            margin-left: 0.5rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
        }
        
        .message-input button:hover {
            background-color: #2980b9;
        }
        
        /* Call Modal */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }
        
        .modal.active {
            display: flex;
        }
        
        .modal-content {
            background-color: white;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            overflow: hidden;
        }
        
        .call-header {
            padding: 1rem;
            background-color: #2c3e50;
            color: white;
            text-align: center;
        }
        
        .call-body {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .call-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #3498db;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        
        .call-name {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .call-status {
            color: #666;
            margin-bottom: 2rem;
        }
        
        .call-actions {
            display: flex;
            gap: 1rem;
        }
        
        .btn-call-action {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 1.5rem;
        }
        
        .btn-answer {
            background-color: #27ae60;
            color: white;
        }
        
        .btn-decline {
            background-color: #e74c3c;
            color: white;
        }
        
        .btn-end-call {
            background-color: #e74c3c;
            color: white;
        }
        
        /* Video Call */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }
        
        .video-large {
            width: 100%;
            height: 300px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .video-small {
            position: absolute;
            width: 120px;
            height: 90px;
            background-color: #333;
            border-radius: 8px;
            bottom: 1rem;
            right: 1rem;
            overflow: hidden;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .call-controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 1rem;
        }
        
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #999;
        }
        
        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
    </style>
</head>

    <script>
        // DOM Elements
        const conversationList = document.getElementById('conversation-list');
        const emptyState = document.getElementById('empty-state');
        const chatContent = document.getElementById('chat-content');
        const chatAvatar = document.getElementById('chat-avatar');
        const chatName = document.getElementById('chat-name');
        const messagesContainer = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const sendMessageButton = document.getElementById('send-message');
        
        // Call elements
        const callModal = document.getElementById('call-modal');
        const callHeaderText = document.getElementById('call-header-text');
        const callAvatar = document.getElementById('call-avatar');
        const callName = document.getElementById('call-name');
        const callStatus = document.getElementById('call-status');
        const incomingCallActions = document.getElementById('incoming-call-actions');
        const outgoingCallActions = document.getElementById('outgoing-call-actions');
        const btnAudioCall = document.getElementById('btn-audio-call');
        const btnVideoCall = document.getElementById('btn-video-call');
        const btnAnswer = document.getElementById('btn-answer');
        const btnDecline = document.getElementById('btn-decline');
        const btnEndCall = document.getElementById('btn-end-call');
        
        // Video call elements
        const callRegular = document.getElementById('call-regular');
        const callVideo = document.getElementById('call-video');
        const localVideo = document.getElementById('local-video');
        const remoteVideo = document.getElementById('remote-video');
        const btnToggleAudio = document.getElementById('btn-toggle-audio');
        const btnToggleVideo = document.getElementById('btn-toggle-video');
        const btnEndVideoCall = document.getElementById('btn-end-video-call');
        
        // State
        let currentUser = null;
        let conversations = [];
        let selectedConversation = null;
        let messages = [];
        let localStream = null;
        let isAudioMuted = false;
        let isVideoOff = false;
        
        // Initialize
        async function initialize() {
            try {
                // Get current user
                const userResponse = await fetch('/api/user');
                currentUser = await userResponse.json();
                
                // Get conversations
                const conversationsResponse = await fetch('/api/conversations');
                conversations = await conversationsResponse.json();
                
                // Render conversations
                renderConversations();
            } catch (error) {
                console.error('Error initializing:', error);
            }
        }
        
        // Render conversations
        function renderConversations() {
            conversationList.innerHTML = '';
            
            conversations.forEach(conversation => {
                const div = document.createElement('div');
                div.className = 'conversation';
                div.dataset.id = conversation.id;
                
                // Get the other participant (for direct messages)
                const otherParticipant = conversation.participants.find(p => p.id !== currentUser?.id) || conversation.participants[0];
                
                // Get initials for avatar
                const initials = otherParticipant.name.split(' ').map(n => n[0]).join('');
                
                div.innerHTML = `
                    <div class="avatar">${initials}</div>
                    <div class="conversation-info">
                        <div class="conversation-name">${conversation.name}</div>
                        <div class="last-message">${conversation.last_message.text}</div>
                    </div>
                `;
                
                div.addEventListener('click', () => selectConversation(conversation));
                
                conversationList.appendChild(div);
            });
        }
        
        // Select conversation
        async function selectConversation(conversation) {
            // Update UI
            document.querySelectorAll('.conversation').forEach(el => {
                el.classList.remove('active');
                if (el.dataset.id === conversation.id) {
                    el.classList.add('active');
                }
            });
            
            // Show chat content
            emptyState.style.display = 'none';
            chatContent.style.display = 'flex';
            
            // Update selected conversation
            selectedConversation = conversation;
            
            // Get the other participant (for direct messages)
            const otherParticipant = conversation.participants.find(p => p.id !== currentUser?.id) || conversation.participants[0];
            
            // Update chat header
            const initials = otherParticipant.name.split(' ').map(n => n[0]).join('');
            chatAvatar.textContent = initials;
            chatName.textContent = conversation.name;
            
            // Load messages
            try {
                const messagesResponse = await fetch(`/api/conversations/${conversation.id}/messages`);
                messages = await messagesResponse.json();
                
                // Render messages
                renderMessages();
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        // Render messages
        function renderMessages() {
            messagesContainer.innerHTML = '';
            
            messages.forEach(message => {
                const div = document.createElement('div');
                div.className = `message ${message.sender_id === currentUser?.id ? 'sent' : 'received'}`;
                
                const time = new Date(message.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                div.innerHTML = `
                    <div class="message-text">${message.text}</div>
                    <div class="message-time">${time}</div>
                `;
                
                messagesContainer.appendChild(div);
            });
            
            // Scroll to bottom
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }
        
        // Send message
        function sendMessage() {
            const text = messageInput.value.trim();
            
            if (!text || !selectedConversation) return;
            
            // Create new message
            const newMessage = {
                id: `msg-${Date.now()}`,
                conversation_id: selectedConversation.id,
                sender_id: currentUser.id,
                text: text,
                timestamp: new Date().toISOString(),
                read: true
            };
            
            // Add to messages
            messages.push(newMessage);
            
            // Update last message in conversation
            selectedConversation.last_message = {
                text: text,
                timestamp: new Date().toISOString(),
                sender_id: currentUser.id
            };
            
            // Render messages
            renderMessages();
            
            // Clear input
            messageInput.value = '';
            
            // In a real app, you would send the message to the server here
        }
        
        // Handle audio call
        function handleAudioCall() {
            if (!selectedConversation) return;
            
            // Get the other participant
            const otherParticipant = selectedConversation.participants.find(p => p.id !== currentUser?.id) || selectedConversation.participants[0];
            
            // Show call modal
            callModal.classList.add('active');
            callHeaderText.textContent = 'Outgoing Call';
            
            // Set call info
            const initials = otherParticipant.name.split(' ').map(n => n[0]).join('');
            callAvatar.textContent = initials;
            callName.textContent = otherParticipant.name;
            callStatus.textContent = 'Calling...';
            
            // Show outgoing call actions
            incomingCallActions.style.display = 'none';
            outgoingCallActions.style.display = 'flex';
            
            // Show regular call UI
            callRegular.style.display = 'flex';
            callVideo.style.display = 'none';
            
            // In a real app, you would initiate the call here
            
            // Simulate incoming call after 2 seconds
            setTimeout(() => {
                // Update call status
                callStatus.textContent = 'Connected';
                
                // In a real app, this would happen when the call is answered
            }, 2000);
        }
        
        // Handle video call
        async function handleVideoCall() {
            if (!selectedConversation) return;
            
            // Get the other participant
            const otherParticipant = selectedConversation.participants.find(p => p.id !== currentUser?.id) || selectedConversation.participants[0];
            
            // Show call modal
            callModal.classList.add('active');
            callHeaderText.textContent = 'Video Call';
            
            // Hide regular call UI, show video call UI
            callRegular.style.display = 'none';
            callVideo.style.display = 'block';
            
            try {
                // Get user media
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: true, 
                    video: true 
                });
                
                // Display local video
                localVideo.srcObject = localStream;
                
                // In a real app, you would connect to the remote peer here
                
                // Simulate remote video after 2 seconds
                setTimeout(() => {
                    // Use local stream as remote stream for demo
                    remoteVideo.srcObject = localStream;
                    
                    // In a real app, this would be the remote stream
                }, 2000);
            } catch (error) {
                console.error('Error accessing media devices:', error);
                alert('Failed to access camera and microphone. Please check permissions.');
                
                // Close modal
                closeCallModal();
            }
        }
        
        // Toggle audio
        function toggleAudio() {
            if (!localStream) return;
            
            const audioTracks = localStream.getAudioTracks();
            if (audioTracks.length === 0) return;
            
            isAudioMuted = !isAudioMuted;
            audioTracks[0].enabled = !isAudioMuted;
            
            // Update button
            btnToggleAudio.innerHTML = isAudioMuted 
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M9 9v3a3 3 0 0 0 5.12 2.12M15 9.34V4a3 3 0 0 0-5.94-.6"></path><path d="M17 16.95A7 7 0 0 1 5 12v-2m14 0v2a7 7 0 0 1-.11 1.23"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
        }
        
        // Toggle video
        function toggleVideo() {
            if (!localStream) return;
            
            const videoTracks = localStream.getVideoTracks();
            if (videoTracks.length === 0) return;
            
            isVideoOff = !isVideoOff;
            videoTracks[0].enabled = !isVideoOff;
            
            // Update button
            btnToggleVideo.innerHTML = isVideoOff
                ? '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M13.79 10.74L21 7v10"></path><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>'
                : '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>';
        }
        
        // End call
        function endCall() {
            // Stop media streams
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            // Reset video elements
            localVideo.srcObject = null;
            remoteVideo.srcObject = null;
            
            // Close modal
            closeCallModal();
        }
        
        // Close call modal
        function closeCallModal() {
            callModal.classList.remove('active');
            
            // Reset state
            isAudioMuted = false;
            isVideoOff = false;
            
            // Reset UI
            btnToggleAudio.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
            btnToggleVideo.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>';
        }
        
        // Event listeners
        sendMessageButton.addEventListener('click', sendMessage);
        
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        btnAudioCall.addEventListener('click', handleAudioCall);
        btnVideoCall.addEventListener('click', handleVideoCall);
        
        btnAnswer.addEventListener('click', () => {
            // In a real app, you would answer the call here
            callStatus.textContent = 'Connected';
            incomingCallActions.style.display = 'none';
            outgoingCallActions.style.display = 'flex';
        });
        
        btnDecline.addEventListener('click', closeCallModal);
        btnEndCall.addEventListener('click', endCall);
        btnEndVideoCall.addEventListener('click', endCall);
        
        btnToggleAudio.addEventListener('click', toggleAudio);
        btnToggleVideo.addEventListener('click', toggleVideo);
        
        // Initialize
        initialize();
        
        // Simulate incoming call after 5 seconds (for demo)
        setTimeout(() => {
            if (conversations.length > 0) {
                // Get the first conversation
                const conversation = conversations[0];
                
                // Get the other participant
                const otherParticipant = conversation.participants.find(p => p.id !== currentUser?.id) || conversation.participants[0];
                
                // Show call modal
                callModal.classList.add('active');
                callHeaderText.textContent = 'Incoming Call';
                
                // Set call info
                const initials = otherParticipant.name.split(' ').map(n => n[0]).join('');
                callAvatar.textContent = initials;
                callName.textContent = otherParticipant.name;
                callStatus.textContent = 'Incoming call...';
                
                // Show incoming call actions
                incomingCallActions.style.display = 'flex';
                outgoingCallActions.style.display = 'none';
                
                // Show regular call UI
                callRegular.style.display = 'flex';
                callVideo.style.display = 'none';
            }
        }, 5000);
    </script>
</body>
</html>
