<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient background circle -->
  <defs>
    <linearGradient id="hc-grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="hc-stroke" x1="16" y1="16" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5E7EB"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <circle cx="32" cy="32" r="30" fill="url(#hc-grad)"/>
  <circle cx="32" cy="32" r="30" fill="black" fill-opacity="0.12"/>

  <!-- Monogram: stylized H and C using paths for a clean, professional look -->
  <!-- H -->
  <rect x="18" y="18" width="6" height="28" rx="2" fill="white" opacity="0.95"/>
  <rect x="40" y="18" width="6" height="28" rx="2" fill="white" opacity="0.95"/>
  <rect x="24" y="30" width="16" height="4" rx="2" fill="white" opacity="0.95"/>

  <!-- C (outer arc) -->
  <path d="M47 24.5a12.5 12.5 0 1 0 0 15" stroke="url(#hc-stroke)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Orbiting connection nodes -->
  <g opacity="0.9">
    <circle cx="48" cy="16" r="3" fill="#FFFFFF"/>
    <circle cx="16" cy="48" r="3" fill="#FFFFFF"/>
    <circle cx="50" cy="48" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Subtle connection lines -->
  <path d="M32 32 L48 16" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="2"/>
  <path d="M32 32 L16 48" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M36 36 L50 48" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Gloss highlight -->
  <path d="M10 20c6-7 17-10 22-10 10 0 15 4 18 6" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6" stroke-linecap="round"/>
</svg>